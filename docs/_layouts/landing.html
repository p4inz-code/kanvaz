<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanvaz: the free, offline reference board for artists</title>
  <meta name="description" content="Free, open-source, 100% offline reference board for VFX artists, 3D artists and creative professionals. Infinite canvas, Map View, 3D, video, PureRef import, always on top beside ZBrush and Blender.">
  <meta property="og:title" content="Kanvaz: the free, offline reference board for artists">
  <meta property="og:description" content="Infinite canvas, Map View, 3D model previews, PureRef import. Free, open source, no account.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://p4inz-code.github.io/kanvaz/">
  <meta property="og:image" content="https://github.com/p4inz-code/kanvaz/blob/main/assets/banner.png?raw=true">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="keywords" content="reference board, moodboard, PureRef alternative, VFX, 3D art, offline, open source, infinite canvas, Electron">
  <meta name="theme-color" content="#9D7FFF">
  <link rel="icon" type="image/png" href="{{ '/assets/img/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/guide.css' | relative_url }}">
  <script>
    try { var t = localStorage.getItem('kanvaz-guide-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body class="landing">
<header class="topbar">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/img/icon.png' | relative_url }}" alt="" width="28" height="28">
    <span>Kanvaz</span>
  </a>
  <nav class="top-links always" aria-label="Site links">
    <a href="{{ '/guide/' | relative_url }}">Guide</a>
    <a href="https://github.com/p4inz-code/kanvaz/releases/latest">Download</a>
    <a href="https://github.com/p4inz-code/kanvaz/blob/main/CHANGELOG.md">Changelog</a>
    <a href="https://github.com/p4inz-code/kanvaz">GitHub</a>
    <a class="star-btn" href="https://github.com/p4inz-code/kanvaz/stargazers">&#9733; Star</a>
  </nav>
  <button class="search-btn" id="search-btn" type="button" aria-label="Search the guide" title="Search (press /)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <span>Search</span><kbd>/</kbd>
  </button>
  <button class="icon-btn" id="theme-btn" aria-label="Switch between light and dark theme" title="Switch theme">
    <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>
<main class="land">
{{ content }}
</main>
<div class="sm" id="sm" hidden>
  <div class="sm-box" role="dialog" aria-modal="true" aria-label="Search the guide">
    <input id="sm-input" type="search" placeholder="Search the guide: shortcuts, MoodLock, .pur, always on top..." autocomplete="off" spellcheck="false">
    <ul id="sm-list" role="listbox"></ul>
    <div class="sm-foot"><span><kbd>&uarr;</kbd><kbd>&darr;</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>
<script>window.KZ_SEARCH="{{ '/search.json' | relative_url }}";</script>
<script src="{{ '/assets/js/guide.js' | relative_url }}"></script>
<script>
  /* label the main download button for the visitor's system */
  (function () {
    var ua = navigator.userAgent;
    var os = /Mac/.test(ua) ? 'macOS' : (/Android/.test(ua) ? '' : (/Linux|X11/.test(ua) ? 'Linux' : (/Win/.test(ua) ? 'Windows' : '')));
    var b = document.getElementById('dl-label');
    if (b && os) b.textContent = 'Download for ' + os;
  })();
</script>
</body>
</html>
