<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- script-src 'self' file:' — the "file:" addition (4.2.0) is a narrow,
       deliberate loosening scoped to the plugin system: it allows loading a
       <script src="file://..."> pointing at a user-installed plugin's entry
       file, and nothing else. It does NOT add 'unsafe-inline' or
       'unsafe-eval' — inline scripts and eval/Function-from-string are still
       fully blocked everywhere in the app, including inside plugin code.
       worker-src is set explicitly to 'self' (audit fix, 4.2.0) — without
       it, an unset worker-src falls back through child-src to script-src,
       which would implicitly let the same file: grant spin up a
       new Worker('file:///...') too. Nothing in the app does this today,
       but there's no reason to leave that door open. -->
  <!-- Note on defense-in-depth vs. the plugin trust model: CSP protects
       against script/content INJECTION (e.g. a stray innerHTML bug). It
       does not and cannot sandbox an APPROVED plugin's own code — that
       plugin's script is intentionally allowed to run, same page context
       as the rest of the app. See SECURITY.md and the comment above the
       plugin IPC handlers in main.js for the actual trust boundary. -->

  <!-- connect-src gained "blob:" in 7.4.x — found live, not by static
       review: Three.js's GLTFLoader prefers ImageBitmapLoader for
       embedded texture images (createImageBitmap is supported here), and
       ImageBitmapLoader's load() path is fetch()-based, not a plain
       <img src>. It creates a blob: URL for each embedded texture and
       fetch()'s it — a fetch of ANY scheme, including blob:, is governed
       by connect-src, not img-src (img-src only gates direct <img>/CSS
       url() loads). Without "blob:" here, every embedded GLB/glTF
       texture silently failed to decode — Normal mode rendered
       untextured and Matcap's own `map` passthrough had nothing to show
       either, while the network-security intent (offline-only) is
       untouched: a blob: URL is a same-process, locally-generated
       object reference, never real network egress. -->
  <!-- connect-src gained "data:" the same way — found via live user
       audit, not static review: cards.js's generateWaveform() reads an
       audio card's own embedded dataUrl via fetch() before handing the
       bytes to decodeAudioData(), and fetch() of ANY scheme (including
       data:) is governed by connect-src, same class of gap "blob:"
       above already fixed for a different loader. Without it, every
       single audio card's waveform silently failed to generate,
       forever — generateWaveform()'s own catch() swallows the error,
       so this shipped invisibly. media-src already trusted "data:" for
       the exact same embedded-card-content case (the <audio> element
       itself loads fine); a data: URI is inline, self-contained bytes
       with no network egress possible, so this closes the same kind of
       gap with the same "no real security cost" reasoning already
       established for blob: above. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' file:; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://api.github.com blob: data:; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanvaz</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

<div id="app">

<div id="top-chrome">

  <!-- Titlebar -->
  <div id="titlebar">
    <!-- data-tooltip, not title: this sits inside #titlebar's drag
         region (see the other 4 titlebar buttons' own comment on why
         a plain title attribute can leak a native tooltip there). -->
    <div id="titlebar-logo" data-tooltip="Home Screen">
      <img class="logo-icon" src="../assets/icons/icon-128.png" alt="" width="18" height="18">
      <span class="logo-text">Kanvaz</span>
    </div>

    <div id="titlebar-title">Untitled Board</div>

    <div id="titlebar-controls">
      <!-- Direct feedback: "remove save as in corner near minimize
           totally since save and save as are almost the same so one of
           em must be removed completely" — the titlebar's dedicated
           Save-As button (formerly id="btn-export") sat one click away
           from Save on the regular toolbar and did nothing a titlebar
           button earns its place for. Save As itself isn't gone — still
           reachable via Ctrl+Shift+S and the Command Palette
           (core.saveBoardAs) for the genuine "write a copy under a new
           name" case — only this redundant titlebar shortcut to it is
           removed.
           data-tooltip, not title: these 3 buttons sit inside #titlebar's
           -webkit-app-region:drag ancestor (they're individually marked
           no-drag so clicks work, but Windows' own drag-region hit-
           testing can still let a native OS tooltip through for a plain
           title attribute here, unstyled and out of Kanvaz's theme,
           bypassing tooltip.js's suppression entirely — confirmed live,
           not theoretical). data-tooltip isn't a real HTML attribute
           the browser acts on, so there's nothing native left to leak;
           tooltip.js reads it as a second source, same custom UI. -->
      <button class="titlebar-btn" id="btn-minimize" data-tooltip="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" data-tooltip="Maximize">
        <svg id="icon-maximize" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        <svg id="icon-restore" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" data-tooltip="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="toolbar-btn" id="btn-new" title="New Board">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      New
    </button>
    <button class="toolbar-btn" id="btn-open" title="Open Board (Ctrl+O)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open
    </button>
    <button class="toolbar-btn" id="btn-import" title="Import files (3D models, images, GIFs, video, audio). For a PureRef .pur board, right-click the canvas.">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Import
    </button>
    <button class="toolbar-btn" id="btn-save" title="Save Board (Ctrl+S)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>

    <div class="toolbar-sep"></div>

    <button class="toolbar-btn" id="btn-zoom-in" title="Zoom in (scroll up)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="toolbar-btn" id="zoom-display" title="Reset zoom (0)" style="min-width:52px; font-family: var(--font-mono); font-size:11px;">100%</button>
    <button class="toolbar-btn" id="btn-zoom-out" title="Zoom out (scroll down)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>

    <div class="toolbar-sep"></div>

    <button class="toolbar-btn" id="btn-undo" title="Undo (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="toolbar-btn" id="btn-redo" title="Redo (Ctrl+Y)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>

    <div class="view-toggle-wrap">
      <button class="view-toggle-btn view-toggle-active" id="btn-view-board" title="Board view">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Board
      </button>
      <button class="view-toggle-btn" id="btn-view-map" title="Map view (M)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Map
      </button>
      <!-- Scratch Board (9.5.0) — third view, same cards as Board, plus a
           configurable background and a board-wide annotation layer. See
           scratch-board.js. -->
      <button class="view-toggle-btn" id="btn-view-scratch" title="Scratch Board">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        Scratch
      </button>
    </div>

    <!-- Scratch Board drawing toolbar — only visible while Scratch view is
         active (scratch-board.js toggles the "visible" class). Kept as a
         sibling of the view-toggle group so it doesn't shift other
         toolbar buttons around when it appears/disappears. -->
    <div class="scratch-toolbar" id="scratch-toolbar">
      <!-- Select/Pan — the default tool (Illustrator/Figma convention).
           While armed, drawing is off and the canvas behaves exactly like
           Board view: pan, click/drag cards, marquee-select all work.
           Any OTHER tool below disables all of that — the two are always
           mutually exclusive (scratch-board.js's isToolArmed()). -->
      <button class="scratch-tool-btn" id="scratch-tool-select" data-tool="select" title="Select / Pan">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2-7 7-2z"/></svg>
      </button>
      <div class="scratch-toolbar-sep"></div>
      <button class="scratch-tool-btn" id="scratch-tool-pen" data-tool="pen" title="Pen">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
      </button>
      <button class="scratch-tool-btn" id="scratch-tool-highlighter" data-tool="highlighter" title="Highlighter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l3 3"/><path d="M4.5 21l1.5-4 12-12 3 3-12 12-4.5 1z"/></svg>
      </button>
      <button class="scratch-tool-btn" id="scratch-tool-line" data-tool="line" title="Line">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"/></svg>
      </button>
      <button class="scratch-tool-btn" id="scratch-tool-arrow" data-tool="arrow" title="Arrow">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="4"/><polyline points="9 4 20 4 20 15"/></svg>
      </button>
      <button class="scratch-tool-btn" id="scratch-tool-rect" data-tool="rect" title="Rectangle">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
      </button>
      <button class="scratch-tool-btn" id="scratch-tool-ellipse" data-tool="ellipse" title="Ellipse">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="9" ry="6"/></svg>
      </button>
      <!-- Eraser — drag over a stroke to remove it entirely (whole-stroke,
           not pixel erasing). Hand-authored icon, same plain stroke style
           as every other icon in this file (viewBox 24, stroke-width 2,
           round caps/joins) — not from any external icon set. -->
      <button class="scratch-tool-btn" id="scratch-tool-eraser" data-tool="eraser" title="Eraser">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13l-7 7H7l-4-4a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l4.6 4.6a2 2 0 0 1 0 2.8L18 13z"/><path d="M8.5 21H21"/></svg>
      </button>
      <div class="scratch-toolbar-sep"></div>
      <!-- Width/opacity number inputs and the background color swatches
           used to live here too — trimmed back out (found live: with the
           full tool set, this toolbar got wide enough to force the WHOLE
           app toolbar into horizontal overflow). They're fully available,
           live-synced, in the Properties panel's Scratch Board section
           (properties.js's renderScratchBoardSection) instead — same
           pattern Board view itself uses: a compact top toolbar, detailed
           settings in Properties, not both at once. -->
      <input type="color" id="scratch-color-swatch" class="scratch-color-swatch" title="Stroke color" value="#7C5CFC">
      <div class="scratch-toolbar-sep"></div>
      <!-- Broom, not a trash can — this clears STROKES on the current
           board, not a destructive delete-something-permanent action in
           the trash-can sense the rest of the app uses that icon for.
           Redrawn (the first attempt read as an illegible squiggle at
           toolbar size): a straight handle plus a clean, closed
           parallelogram brush head with two short sweep-accent strokes
           underneath, so the silhouette reads as "broom" even at 14px.
           Hand-authored, same plain stroke style as every other icon
           here (viewBox 24, stroke-width 2, round caps/joins, fill:none)
           — not from any external icon set. -->
      <button class="scratch-tool-btn" id="scratch-tool-clear" title="Clean board — clears every stroke">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 3l-8 8"/><path d="M12 11l4 4-8 6-4-4z"/><path d="M6 21l-2 2"/><path d="M10 21l-2 2"/></svg>
      </button>
      <div class="scratch-toolbar-sep"></div>
      <!-- Background style cycles: ruled lines -> plain color -> grid -> back.
           Label updates from scratch-board.js so the button always shows the
           CURRENT style (clicking advances to the next one). -->
      <button class="scratch-tool-btn scratch-bg-btn" id="scratch-tool-bgstyle" title="Background style (click to cycle) — fill/line/grid colors are in Properties">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="8" x2="21" y2="8"/><line x1="3" y1="13" x2="21" y2="13"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <!-- Background fill/line/grid color swatches: Properties panel only
           now (see the comment on the toolbar-sep above the stroke-color
           swatch) — #scratch-bgcolor-swatch and #scratch-accent-color-
           swatch still exist as element ids that scratch-board.js's
           setBgColor()/setLineColor()/setGridColor()/updateBgStyleBtn()
           sync TO if present, they're just not placed in THIS toolbar
           anymore; every one of those functions null-checks the element
           first, so their absence here is a no-op, not a bug. -->
    </div>

    <div class="toolbar-spacer"></div>

    <!-- v7.x redesign added the menu (Profile/Manage Profiles/Home/
         About/Shortcuts); v8.x gave the button itself the same real
         colored-circle avatar treatment the Home Screen's own account
         button already has (sidepanel.js's syncAccountButtonAvatar()
         fills in the real initial/photo once profile data loads — the
         plain "K" here is just the pre-JS fallback, same idea as any
         other placeholder-until-hydrated content). -->
    <button class="toolbar-btn" id="btn-account" title="About, Shortcuts, Profile">K</button>
    <!-- Dropdown menu for the account/corner icon above — plain, small,
         same dismiss-on-outside-click convention as every other popover
         in this app (see app.js's showReferenceModePopover-era pattern,
         now used here). Populated/shown by sidepanel.js. -->
    <div id="account-menu" class="account-menu" hidden>
      <div class="account-menu-profile-label" id="account-menu-profile-label">Profile</div>
      <button class="account-menu-item" id="account-menu-profiles">Manage Profiles&hellip;</button>
      <div class="account-menu-sep"></div>
      <button class="account-menu-item" id="account-menu-home">Home Screen</button>
      <button class="account-menu-item" id="account-menu-about">About Kanvaz</button>
      <button class="account-menu-item" id="account-menu-shortcuts">Shortcuts</button>
    </div>
  </div>

</div>

  <!-- v7.x redesign — left side panel: an always-visible icon rail
       (Boards / Properties / Settings) plus a content pane that opens
       and closes with the S key. Replaces the old top board-tab strip
       and the floating Settings popover entirely. Populated by
       sidepanel.js (rail switching/S-key toggle), boards.js (Boards
       section), properties.js (Properties section), and ui.js
       (Settings section). -->
  <div id="main-area">
    <div id="side-panel">
      <div id="side-panel-rail">
        <button class="rail-btn" id="rail-boards" data-section="boards" title="Boards">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="rail-btn" id="rail-properties" data-section="properties" title="Properties">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button class="rail-btn" id="rail-layers" data-section="layers" title="Layers">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
        </button>
        <button class="rail-btn" id="rail-settings" data-section="settings" title="Settings (S)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div id="side-panel-content"></div>
    </div>

  <!-- Canvas area -->
  <div id="canvas-container">
    <canvas id="canvas-grid"></canvas>
    <!-- Scratch Board (9.5.0): a plain annotate-everything background
         (ruled lines / solid colour / normal grid, see Properties while
         Scratch is active), shown instead of canvas-grid only while this
         view is selected. Same layer, same full-viewport sizing pattern. -->
    <canvas id="scratch-bg-canvas"></canvas>
    <div id="canvas-world"></div>
    <!-- Board-wide stroke layer, deliberately a SIBLING positioned after
         canvas-world (not a child) so it renders above every card
         regardless of any individual card's own z-index, and pans/zooms
         in lockstep via the same world-space coordinates (see
         scratch-board.js — every stroke point is stored and redrawn
         through KanvazCanvas.worldToScreen, never CSS-transformed as a
         DOM child would be). pointer-events toggles on only while a
         Scratch drawing tool is actually armed, so cards underneath stay
         fully clickable/draggable the rest of the time. -->
    <canvas id="scratch-strokes-canvas"></canvas>

    <!-- Empty state -->
    <div id="canvas-empty">
      <svg class="empty-icon" viewBox="0 0 48 48" fill="none">
        <rect x="6" y="14" width="28" height="22" rx="3" stroke="currentColor" stroke-width="2"/>
        <rect x="12" y="10" width="28" height="22" rx="3" stroke="currentColor" stroke-width="2"/>
        <rect x="18" y="6" width="24" height="18" rx="3" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2"/>
        <circle cx="38" cy="8" r="4" fill="currentColor" opacity="0.3"/>
      </svg>
      <span class="empty-title">Drop a 3D model, image, video, or GIF here</span>
      <span class="empty-sub" id="empty-sub-hint">Right-click for options · Ctrl+V to paste an image</span>
    </div>

    <!-- Drop overlay -->
    <div id="drop-overlay">
      <span class="drop-label">Drop to add to canvas</span>
    </div>
  </div>
  </div><!-- /#main-area -->

  <!-- Status bar -->
  <div id="statusbar">
    <div class="status-item">
      <span class="status-label">Cards</span>
      <span class="status-value" id="status-cards">0</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-item">
      <span class="status-label">Zoom</span>
      <span class="status-value" id="status-zoom">100%</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-item">
      <span class="status-label">Pos</span>
      <span class="status-value" id="status-pos">0, 0</span>
    </div>
    <div class="status-spacer"></div>
    <span id="status-autosave" style="font-size:10px;color:var(--color-green);opacity:0;transition:opacity 0.3s;margin-right:12px;font-family:var(--font-ui);"></span>
    <div class="status-item" id="status-save">Ready</div>
  </div>

</div>

<!-- Context menu -->
<div id="context-menu"></div>

<!-- Dialog overlay -->
<div id="dialog-overlay">
  <div class="dialog" id="dialog-box">
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <input type="text" id="dialog-input" class="dialog-input" style="display:none;">
    <div class="dialog-btns" id="dialog-btns"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="media.js"></script>
<script src="canvas.js"></script>
<script src="model3d-modes.js"></script>
<script src="cards.js"></script>
<script src="connections.js"></script>
<script src="history.js"></script>
<script src="annotate.js"></script>
<script src="boards.js"></script>
<script src="inspector.js"></script>
<script src="properties.js"></script>
<script src="map-view.js"></script>
<script src="scratch-board.js"></script>
<script src="shortcuts.js"></script>
<script src="ui.js"></script>
<script src="sidepanel.js"></script>
<script src="commands.js"></script>
<script src="plugin-api.js"></script>
<script src="app.js"></script>

</body>
