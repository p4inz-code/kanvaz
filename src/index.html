<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- script-src 'self' file:' — the "file:" addition (4.2.0) is a narrow,
       deliberate loosening scoped to the plugin system: it allows loading a
       <script src="file://..."> pointing at a user-installed plugin's entry
       file, and nothing else. It does NOT add 'unsafe-inline' or
       'unsafe-eval' — inline scripts and eval/Function-from-string are still
       fully blocked everywhere in the app, including inside plugin code.
       worker-src is set explicitly to 'self' (audit fix, 4.2.0) — without
       it, an unset worker-src falls back through child-src to script-src,
       which would implicitly let the same file: grant spin up a
       new Worker('file:///...') too. Nothing in the app does this today,
       but there's no reason to leave that door open. -->
  <!-- Note on defense-in-depth vs. the plugin trust model: CSP protects
       against script/content INJECTION (e.g. a stray innerHTML bug). It
       does not and cannot sandbox an APPROVED plugin's own code — that
       plugin's script is intentionally allowed to run, same page context
       as the rest of the app. See SECURITY.md and the comment above the
       plugin IPC handlers in main.js for the actual trust boundary. -->

  <!-- connect-src gained "blob:" in 7.4.x — found live, not by static
       review: Three.js's GLTFLoader prefers ImageBitmapLoader for
       embedded texture images (createImageBitmap is supported here), and
       ImageBitmapLoader's load() path is fetch()-based, not a plain
       <img src>. It creates a blob: URL for each embedded texture and
       fetch()'s it — a fetch of ANY scheme, including blob:, is governed
       by connect-src, not img-src (img-src only gates direct <img>/CSS
       url() loads). Without "blob:" here, every embedded GLB/glTF
       texture silently failed to decode — Normal mode rendered
       untextured and Matcap's own `map` passthrough had nothing to show
       either, while the network-security intent (offline-only) is
       untouched: a blob: URL is a same-process, locally-generated
       object reference, never real network egress. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' file:; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' https://api.github.com blob:; object-src 'none'; base-uri 'self';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanvaz</title>
  <link rel="stylesheet" href="main.css">
</head>
<body>

<div id="app">

<div id="top-chrome">

  <!-- Titlebar -->
  <div id="titlebar">
    <div id="titlebar-logo">
      <img class="logo-icon" src="../assets/icons/icon-128.png" alt="" width="18" height="18">
      <span class="logo-text">Kanvaz</span>
    </div>

    <div id="titlebar-title">Untitled Board</div>

    <div id="titlebar-controls">
      <!-- Audit fix: this button calls KanvazBoards.saveBoardAs(), which
           writes a new .kanvaz file (same native format, new path/name) —
           it does not convert to any other file format, so "Export" was
           misleading. Left the element id as btn-export (internal only,
           app.js wires it via getElementById) to avoid an unrelated
           id-rename diff; only the user-facing label changed. -->
      <!-- v7.x — icon set switched to Feather Icons (MIT license,
           https://github.com/feathericons/feather) paths, verbatim,
           at Feather's native 24x24 viewBox/stroke-width so they scale
           correctly at any rendered size — only width/height differ
           per button to match this toolbar's existing compact sizing. -->
      <!-- Direct feedback: this used an upload-into-tray glyph that
           reads as "Share" (the exact shape iOS uses for its own Share
           button) right next to the toolbar's plain-disk "Save" — two
           save-related icons with no shared visual language, one of
           them shaped like an entirely different, nonexistent feature
           (Kanvaz has no network sharing). Feather's "copy" icon reads
           as "save a copy" instead — matches what Save As actually
           does (write a new file, same content) without borrowing a
           glyph that already means something else everywhere. -->
      <button class="titlebar-btn" id="btn-export" title="Save board as… (Ctrl+Shift+S)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-minimize" title="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <button class="titlebar-btn" id="btn-maximize" title="Maximize">
        <svg id="icon-maximize" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
        <svg id="icon-restore" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
      </button>
      <button class="titlebar-btn close" id="btn-close" title="Close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div id="toolbar">
    <button class="toolbar-btn" id="btn-new" title="New Board">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      New
    </button>
    <button class="toolbar-btn" id="btn-open" title="Open Board (Ctrl+O)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Open
    </button>
    <button class="toolbar-btn" id="btn-import" title="Import a PureRef (.pur) board">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Import
    </button>
    <button class="toolbar-btn" id="btn-save" title="Save Board (Ctrl+S)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>

    <div class="toolbar-sep"></div>

    <button class="toolbar-btn" id="btn-zoom-in" title="Zoom in (scroll up)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="toolbar-btn" id="zoom-display" title="Reset zoom (0)" style="min-width:52px; font-family: var(--font-mono); font-size:11px;">100%</button>
    <button class="toolbar-btn" id="btn-zoom-out" title="Zoom out (scroll down)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>

    <div class="toolbar-sep"></div>

    <button class="toolbar-btn" id="btn-undo" title="Undo (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="toolbar-btn" id="btn-redo" title="Redo (Ctrl+Y)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>

    <div class="view-toggle-wrap">
      <button class="view-toggle-btn view-toggle-active" id="btn-view-board" title="Board view">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Board
      </button>
      <button class="view-toggle-btn" id="btn-view-map" title="Map view (M)">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Map
      </button>
    </div>

    <div class="toolbar-spacer"></div>

    <!-- v7.x redesign — replaces the old Settings|About|Shortcuts button
         cluster with one corner icon (a plain three-dot glyph, not a
         literal avatar — Kanvaz has no accounts/login to imply). Opens
         a small menu: the active offline profile's name, Manage
         Profiles (switch/create/rename/delete — docs/
         PROFILES_SYSTEM_PLAN.md), About, and Shortcuts. Settings itself
         moved into the new left side panel. -->
    <button class="toolbar-btn" id="btn-account" title="About, Shortcuts, Profile">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="none"><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></svg>
    </button>
    <!-- Dropdown menu for the account/corner icon above — plain, small,
         same dismiss-on-outside-click convention as every other popover
         in this app (see app.js's showReferenceModePopover-era pattern,
         now used here). Populated/shown by sidepanel.js. -->
    <div id="account-menu" class="account-menu" hidden>
      <div class="account-menu-profile-label" id="account-menu-profile-label">Profile</div>
      <button class="account-menu-item" id="account-menu-profiles">Manage Profiles&hellip;</button>
      <div class="account-menu-sep"></div>
      <button class="account-menu-item" id="account-menu-about">About Kanvaz</button>
      <button class="account-menu-item" id="account-menu-shortcuts">Shortcuts</button>
    </div>
  </div>

</div>

  <!-- v7.x redesign — left side panel: an always-visible icon rail
       (Boards / Properties / Settings) plus a content pane that opens
       and closes with the S key. Replaces the old top board-tab strip
       and the floating Settings popover entirely. Populated by
       sidepanel.js (rail switching/S-key toggle), boards.js (Boards
       section), properties.js (Properties section), and ui.js
       (Settings section). -->
  <div id="main-area">
    <div id="side-panel">
      <div id="side-panel-rail">
        <button class="rail-btn" id="rail-boards" data-section="boards" title="Boards">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </button>
        <button class="rail-btn" id="rail-properties" data-section="properties" title="Properties">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </button>
        <button class="rail-btn" id="rail-settings" data-section="settings" title="Settings (S)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <div id="side-panel-content"></div>
    </div>

  <!-- Canvas area -->
  <div id="canvas-container">
    <canvas id="canvas-grid"></canvas>
    <div id="canvas-world"></div>

    <!-- Empty state -->
    <div id="canvas-empty">
      <svg class="empty-icon" viewBox="0 0 48 48" fill="none">
        <rect x="6" y="14" width="28" height="22" rx="3" stroke="currentColor" stroke-width="2"/>
        <rect x="12" y="10" width="28" height="22" rx="3" stroke="currentColor" stroke-width="2"/>
        <rect x="18" y="6" width="24" height="18" rx="3" fill="currentColor" opacity="0.1" stroke="currentColor" stroke-width="2"/>
        <circle cx="38" cy="8" r="4" fill="currentColor" opacity="0.3"/>
      </svg>
      <span class="empty-title">Drop images, GIFs or videos here</span>
      <span class="empty-sub" id="empty-sub-hint">Right-click for options · Ctrl+V to paste an image</span>
    </div>

    <!-- Drop overlay -->
    <div id="drop-overlay">
      <span class="drop-label">Drop to add to canvas</span>
    </div>
  </div>
  </div><!-- /#main-area -->

  <!-- Status bar -->
  <div id="statusbar">
    <div class="status-item">
      <span class="status-label">Cards</span>
      <span class="status-value" id="status-cards">0</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-item">
      <span class="status-label">Zoom</span>
      <span class="status-value" id="status-zoom">100%</span>
    </div>
    <div class="status-sep"></div>
    <div class="status-item">
      <span class="status-label">Pos</span>
      <span class="status-value" id="status-pos">0, 0</span>
    </div>
    <div class="status-spacer"></div>
    <span id="status-autosave" style="font-size:10px;color:var(--color-green);opacity:0;transition:opacity 0.3s;margin-right:12px;font-family:var(--font-ui);"></span>
    <div class="status-item" id="status-save">Ready</div>
  </div>

</div>

<!-- Context menu -->
<div id="context-menu"></div>

<!-- Dialog overlay -->
<div id="dialog-overlay">
  <div class="dialog" id="dialog-box">
    <h2 id="dialog-title"></h2>
    <p id="dialog-message"></p>
    <input type="text" id="dialog-input" class="dialog-input" style="display:none;">
    <div class="dialog-btns" id="dialog-btns"></div>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Scripts — order matters -->
<script src="errors.js"></script>
<script src="tooltip.js"></script>
<script src="colorpicker.js"></script>
<script src="reference-types.js"></script>
<script src="media.js"></script>
<script src="canvas.js"></script>
<script src="cards.js"></script>
<script src="connections.js"></script>
<script src="history.js"></script>
<script src="annotate.js"></script>
<script src="boards.js"></script>
<script src="inspector.js"></script>
<script src="properties.js"></script>
<script src="map-view.js"></script>
<script src="shortcuts.js"></script>
<script src="ui.js"></script>
<script src="sidepanel.js"></script>
<script src="commands.js"></script>
<script src="plugin-api.js"></script>
<script src="app.js"></script>

</body>
</html>
