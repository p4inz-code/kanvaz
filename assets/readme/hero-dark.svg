<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Kanvaz: your references, connected. Cards linked by glowing cables on an infinite canvas.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141c"/><stop offset="1" stop-color="#1d1b2e"/></linearGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.07"/></pattern>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9d7fff"/><stop offset="1" stop-color="#5ec8d8"/></linearGradient>
</defs>
<style>
.flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.bob{animation:bob 6s ease-in-out infinite}.bob2{animation:bob 7.5s ease-in-out infinite reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pulse{animation:pulse 3s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.flow,.bob,.bob2,.pulse{animation:none}}
</style>
<rect width="1200" height="420" rx="22" fill="url(#bg)"/>
<rect width="1200" height="420" rx="22" fill="url(#dots)"/>
