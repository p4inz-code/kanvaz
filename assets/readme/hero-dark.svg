<text x="600" y="214" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#f3f1fb">Your references, connected.</text>
<text x="600" y="248" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#b6b1d0">A free reference board for VFX and 3D artists. Infinite canvas, Map View, 3D, video.</text>
