name: Build

# Validate on every push/PR (cheap — lint + syntax + version consistency).
# Only actually build installers when a v* tag is pushed, one native
# runner per platform since electron-builder can't reliably cross-compile
# NSIS/dmg/AppImage from a single OS.
#
# ── CRITICAL: how to actually ship a release, read before running
#    `gh release create`/`gh release edit --draft=false` for a new tag ──
# electron-builder's `--publish always` (in the build job below) can
# ONLY attach installers to a release that's still a DRAFT for that tag.
# If a release for that tag already exists and is PUBLISHED (not draft)
# by the time this workflow's build job runs, electron-builder logs
# "GitHub release not created — existing type not compatible with
# publishing type" and silently SKIPS uploading every installer file —
# the workflow still reports green/success, and the only thing that
# lands on the release is whatever a separate step uploads with plain
# `gh release upload` (the official-plugin zips below, which have no
# such draft-only restriction). This is exactly how 8 releases in a row
# (v7.14.0–v7.21.0) shipped with zero Windows/Mac/Linux installers and
# only the 3 plugin zips — caught only when a user found empty releases.
#
# The correct sequence after `git push origin vX.Y.Z`:
#   1. Wait for this workflow's "Build" jobs to finish for all three
#      platforms (several minutes each, run serially — see
#      max-parallel: 1 below). Check with `gh run list` /
#      `gh run watch <run-id>`.
#   2. THEN look for the draft release electron-builder created:
#      `gh release list` (it appears with isDraft:true, often at a
#      throwaway "untagged-..." URL until you touch it).
#   3. Edit that SAME draft's title/notes (`gh release edit vX.Y.Z
#      --title "..." --notes-file ...`) and publish it
#      (`--draft=false`). Never call `gh release create` for a tag
#      that doesn't have a draft yet — that's what breaks this.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Least privilege by default. Only the build job (electron-builder
# --publish always + gh release upload) needs contents: write; it is
# granted on that job below.
permissions:
  contents: read

jobs:
  validate:
    name: Validate (lint + syntax + version check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Audit fix (4.2.0): the port-alignment regression test (test/
      # run-port-test.js) needs a real Chrome/Chromium binary and was
      # silently SKIPping on every single CI run — ubuntu-latest has no
      # browser installed by default, and validate.js treats SKIP as
      # non-failing, so this test — which covers a real bug that shipped
      # before (see CHANGELOG 4.1.0) — never actually executed here.
      # @puppeteer/browsers is Puppeteer's own official browser-installer
      # CLI; installing into ~/.cache/puppeteer/chrome is the exact path
      # run-port-test.js's findChrome() already scans as a fallback, so
      # no extra env var wiring is needed for it to be picked up.
      - name: Install Chrome for the port-alignment test
        run: npx @puppeteer/browsers install chrome@stable --path ~/.cache/puppeteer

      - run: npm run validate

      # Dependency audit, whole tree (build tooling included: a compromised
      # build tool is a supply-chain risk for every installer). Blocking since
      # the Electron 44 / electron-builder 26 upgrade brought it to 0 findings.
      - name: npm audit
        run: npm audit --audit-level=high

      # CycloneDX SBOM of production dependencies, kept as a workflow
      # artifact only (deliberately not attached to the release).
      - name: Generate SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --output-format JSON --output-file sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.json

  # Creates the draft release ONCE, before any build leg runs, with real
  # notes pulled straight from CHANGELOG.md. Fixes a real incident: even
  # with the build matrix's max-parallel: 1 below, two "Build" legs still
  # each tried to find-or-create the release for this tag via electron-
  # builder's own --publish always logic and lost that race — GitHub's
  # release-list read right after a create is not immediately consistent,
  # so the second leg's "does it exist yet" check can still say no. Result:
  # two separate drafts for the same tag, each holding a different subset
  # of the installers (v9.6.0, live-caught by the owner). Pre-creating the
  # release here, in its own job the build matrix depends on, removes the
  # race entirely — every later `--publish always` / `gh release upload`
  # call only ever ADDS assets to this one already-existing draft, which
  # is a safe, idempotent operation with no create-vs-create race to lose.
  create-release:
    name: Create draft release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pulls this exact version's own section out of CHANGELOG.md (from
      # its "## [X.Y.Z]" heading to the next one) so every release gets a
      # real, specific description automatically — never the GitHub
      # default "no description provided," and never dependent on someone
      # remembering to run `gh release edit --notes-file` by hand after
      # the fact.
      - name: Extract this version's changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for [$version] — refusing to ship an undescribed release." >&2
            exit 1
          fi
          # Standard "Which file do I download?" guide, every release —
          # dropped by hand starting at 9.5.0 (a purely manual `gh release
          # edit` step someone forgot); templated in here now so it can't
          # be skipped again. <version> is literal in the template file,
          # substituted for the real tag version on every run.
          sed "s/<version>/$version/g" .github/release-download-guide.md >> release-notes.md
          cat release-notes.md

          # Bug found live (v9.6.0): this job shipped a release titled
          # just "9.6.0" — every release before it (back through at
          # least 7.25.0) has a real descriptive title, e.g. "9.5.0 —
          # Scratch Board: ...", because a human always ran `gh release
          # edit --title "..."` by hand before publishing (see this
          # workflow's own top-of-file instructions). This job's --title
          # was never given anything but the bare tag, and nobody caught
          # the missing manual step before v9.6.0 got published bare —
          # the first release built through this newer job. Same
          # heading line release-notes.md's own first line already has
          # ("## [X.Y.Z] — DATE — SUMMARY") gives us everything needed
          # to build the real title automatically, so there is no manual
          # step left to forget.
          heading=$(head -n 1 release-notes.md)
          summary=$(echo "$heading" | sed -E 's/^## \[[^]]+\] — [0-9-]+ — //')
          if [ -z "$summary" ] || [ "$summary" = "$heading" ]; then
            echo "Could not parse a summary out of the CHANGELOG heading — refusing to ship an undescribed title." >&2
            echo "Heading was: $heading" >&2
            exit 1
          fi
          echo "RELEASE_TITLE=$version — $summary" >> "$GITHUB_ENV"

      - name: Create the draft (skip if one already exists for this tag)
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — leaving it as-is."
          else
            gh release create "${GITHUB_REF_NAME}" --draft --title "${RELEASE_TITLE}" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    needs: [validate, create-release]
    if: startsWith(github.ref, 'refs/tags/v')
    # Needed for electron-builder --publish always (uploads installers to
    # the draft create-release already made) and the gh release upload
    # steps below.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # max-parallel: 1 — belt-and-suspenders alongside create-release
      # above. The release itself is no longer a race (it exists before
      # any of these legs starts), but dist/ asset uploads for the same
      # tag still go smoother serialized than three runners hitting the
      # same release's upload endpoint at once.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --publish always uploads build artifacts straight to the GitHub
      # Release matching this tag (creating it as a draft if it doesn't
      # exist yet). Requires the "publish" block in package.json's
      # electron-builder config (see build.publish).
      #
      # No Apple Developer ID cert is configured (CSC_LINK/CSC_KEY_PASSWORD
      # unset) — CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from searching the runner's empty keychain for one, so the mac
      # leg produces a normal *unsigned* dmg instead of erroring. Users
      # will see a Gatekeeper warning until a paid Apple cert is added.
      # USE_HARD_LINKS=false: electron-builder's default hard-link-instead-
      # of-copy optimization has a long-standing, still-unfixed upstream bug
      # (electron-userland/electron-builder#6570 and related issues going
      # back to 22.x) where it collides with an already-existing target file
      # — "EEXIST: file already exists, link '...icon.icns' -> '...icon.icns'"
      # — and fails the whole job. Hit this identically on the macOS leg of
      # the last three tag pushes (v4.3.0, v4.4.0, v4.5.0), Windows/Linux
      # unaffected each time. No known fix in any 2x release; the documented
      # community workaround is forcing plain copies instead of hard links.
      # Costs a little more disk I/O on a CI runner — not worth caring about.
      - name: Build and publish installers
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      # Official-plugin release assets — audit-flagged for two releases
      # running (4.2.1, 4.4.0 roadmap) as "never actually built by CI".
      # Only one matrix leg needs to do this (the zip contents are pure
      # JS/JSON, identical regardless of which OS zipped them) — picked
      # ubuntu-latest arbitrarily since `zip` is preinstalled there.
      # node_modules is deliberately excluded from these zips (matches
      # normal npm package distribution — see official-plugins/mcp-
      # bridge/README.md's own `npm install` setup step for why bundling
      # it in wouldn't even help, that script needs installing wherever
      # the user's MCP client runs it from, not wherever it was zipped).
      - name: Package official plugins
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist-plugins
          version="${GITHUB_REF_NAME#v}"
          for dir in official-plugins/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../dist-plugins/kanvaz-${name}-${version}.zip" . -x 'node_modules/*')
          done
          ls -la dist-plugins

      - name: Publish official plugin assets
        if: matrix.os == 'ubuntu-latest'
        run: gh release upload "${GITHUB_REF_NAME}" dist-plugins/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SHA-256 checksums for the installers electron-builder just uploaded.
      # Runs after the publish step, so the draft release already exists.
      # Top-level dist/ files only (skips win-unpacked/ etc). bash shell so
      # it behaves identically on the Windows runner; sha256sum where
      # available, shasum -a 256 on macOS.
      - name: Generate and upload installer checksums
        # Runs after the release assets are already published, so a problem
        # here must never turn a good release build red.
        continue-on-error: true
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(*.exe *.dmg *.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found in dist/"
            ls -la
            exit 1
          fi
          # Real bug, found live checking v9.7.0's own published checksums
          # against the actual downloaded asset: electron-builder's LOCAL
          # dist/ filenames use its own default template (spaces —
          # "Kanvaz Setup 9.7.0.exe"), but --publish always upload a few
          # steps above this one silently renames spaces to dashes for the
          # GitHub release asset ("Kanvaz-Setup-9.7.0.exe"). This step used
          # to hash the LOCAL (space) names and record THOSE in the
          # checksum file — cryptographically correct, but `sha256sum -c`
          # against a real download would fail with "No such file," since
          # the name it looked for was never the name anyone could
          # actually download. Rename locally to the same dash convention
          # BEFORE hashing, so the recorded name always matches the real
          # asset.
          renamed=()
          for f in "${files[@]}"; do
            new="${f// /-}"
            if [ "$new" != "$f" ]; then mv -- "$f" "$new"; fi
            renamed+=("$new")
          done
          out="SHA256SUMS-${{ matrix.os }}.txt"
          : > "$out"
          for f in "${renamed[@]}"; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" >> "$out"
            else
              shasum -a 256 "$f" >> "$out"
            fi
          done
          cat "$out"
          gh release upload "${GITHUB_REF_NAME}" "$out" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Downloads the DRAFT's real assets and checks them before anyone clicks
  # publish. Exists because the same class of bug shipped more than once:
  # 8 releases with no installers (v7.14.0-v7.21.0), two drafts for one tag
  # (v9.6.0), and in v9.7.0 a download guide naming files that do not exist
  # plus SHA256SUMS naming files nobody could download. The checksum step
  # above is continue-on-error, so a broken one is otherwise invisible.
  # tools/verify-release.js has the actual checks (unit-tested in
  # test/verify-release-test.js, and run against the real v9.7.0 assets).
  #
  # Read-only in practice, but a draft is only visible to a token with push
  # access, hence contents: write. Does NOT publish, edit or delete anything:
  # a red result here means "do not publish yet", nothing more.
  verify-release:
    name: Verify draft release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Download the draft's assets
        run: |
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --dir release-assets
          gh release list --limit 100 --json tagName,isDraft > releases.json
          ls -la release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify names, guide filenames, checksums and release uniqueness
        run: node tools/verify-release.js release-assets "${GITHUB_REF_NAME#v}" --releases releases.json --tag "${GITHUB_REF_NAME}"
