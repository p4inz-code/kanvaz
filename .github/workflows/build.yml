name: Build

# Validate on every push/PR (cheap — lint + syntax + version consistency).
# Only actually build installers when a v* tag is pushed, one native
# runner per platform since electron-builder can't reliably cross-compile
# NSIS/dmg/AppImage from a single OS.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate (lint + syntax + version check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Audit fix (4.2.0): the port-alignment regression test (test/
      # run-port-test.js) needs a real Chrome/Chromium binary and was
      # silently SKIPping on every single CI run — ubuntu-latest has no
      # browser installed by default, and validate.js treats SKIP as
      # non-failing, so this test — which covers a real bug that shipped
      # before (see CHANGELOG 4.1.0) — never actually executed here.
      # @puppeteer/browsers is Puppeteer's own official browser-installer
      # CLI; installing into ~/.cache/puppeteer/chrome is the exact path
      # run-port-test.js's findChrome() already scans as a fallback, so
      # no extra env var wiring is needed for it to be picked up.
      - name: Install Chrome for the port-alignment test
        run: npx @puppeteer/browsers install chrome@stable --path ~/.cache/puppeteer

      - run: npm run validate

  build:
    name: Build (${{ matrix.os }})
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      # max-parallel: 1 — all three legs publish to the SAME GitHub
      # Release for this tag via --publish always. Running them
      # concurrently means two jobs can race to create/update that one
      # release at the same time; electron-builder loses that race hard
      # and fails fast rather than retrying. Serializing costs wall-clock
      # time but removes the race entirely.
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
            script: build:win
          - os: macos-latest
            script: build:mac
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # --publish always uploads build artifacts straight to the GitHub
      # Release matching this tag (creating it as a draft if it doesn't
      # exist yet). Requires the "publish" block in package.json's
      # electron-builder config (see build.publish).
      #
      # No Apple Developer ID cert is configured (CSC_LINK/CSC_KEY_PASSWORD
      # unset) — CSC_IDENTITY_AUTO_DISCOVERY=false stops electron-builder
      # from searching the runner's empty keychain for one, so the mac
      # leg produces a normal *unsigned* dmg instead of erroring. Users
      # will see a Gatekeeper warning until a paid Apple cert is added.
      # USE_HARD_LINKS=false: electron-builder's default hard-link-instead-
      # of-copy optimization has a long-standing, still-unfixed upstream bug
      # (electron-userland/electron-builder#6570 and related issues going
      # back to 22.x) where it collides with an already-existing target file
      # — "EEXIST: file already exists, link '...icon.icns' -> '...icon.icns'"
      # — and fails the whole job. Hit this identically on the macOS leg of
      # the last three tag pushes (v4.3.0, v4.4.0, v4.5.0), Windows/Linux
      # unaffected each time. No known fix in any 2x release; the documented
      # community workaround is forcing plain copies instead of hard links.
      # Costs a little more disk I/O on a CI runner — not worth caring about.
      - name: Build and publish installers
        run: npm run ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_HARD_LINKS: false

      # Official-plugin release assets — audit-flagged for two releases
      # running (4.2.1, 4.4.0 roadmap) as "never actually built by CI".
      # Only one matrix leg needs to do this (the zip contents are pure
      # JS/JSON, identical regardless of which OS zipped them) — picked
      # ubuntu-latest arbitrarily since `zip` is preinstalled there.
      # node_modules is deliberately excluded from these zips (matches
      # normal npm package distribution — see official-plugins/mcp-
      # bridge/README.md's own `npm install` setup step for why bundling
      # it in wouldn't even help, that script needs installing wherever
      # the user's MCP client runs it from, not wherever it was zipped).
      - name: Package official plugins
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist-plugins
          version="${GITHUB_REF_NAME#v}"
          for dir in official-plugins/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "../../dist-plugins/kanvaz-${name}-${version}.zip" . -x 'node_modules/*')
          done
          ls -la dist-plugins

      - name: Publish official plugin assets
        if: matrix.os == 'ubuntu-latest'
        run: gh release upload "${GITHUB_REF_NAME}" dist-plugins/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
